name: 'Fork CI'

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: 'read'

jobs:
  core:
    name: 'Core validation'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v5

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020' # ratchet:actions/setup-node@v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 'Install dependencies'
        run: 'npm ci --ignore-scripts'

      - name: 'Typecheck core'
        run: 'npm run typecheck --workspace @google/gemini-cli-core'

      - name: 'Lint core'
        run: 'npm run lint --workspace @google/gemini-cli-core'

      - name: 'Test core'
        run: 'npm run test:ci --workspace @google/gemini-cli-core'

      - name: 'Build core'
        run: 'npm run build --workspace @google/gemini-cli-core'
